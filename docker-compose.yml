version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: carbon-calc-db
    environment:
      POSTGRES_DB: carboncalc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - carbon-network

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    container_name: carbon-calc-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/carboncalc
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - carbon-network

  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    container_name: carbon-calc-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - carbon-network

volumes:
  postgres_data:

networks:
  carbon-network:
    driver: bridge
