input {
  file {
    path => "/logs/carbon-calc-json.log"
    start_position => "beginning"
    codec => json
    type => "carbon-calc-logs"
  }
}

filter {
  if [type] == "carbon-calc-logs" {
    # Parse timestamp
    date {
      match => ["@timestamp", "ISO8601"]
    }
    
    # Extract log level
    mutate {
      add_field => {
        "log_level" => "%{level}"
      }
    }
    
    # Add tags based on logger name
    if [logger_name] =~ /com.carboncalc.controller/ {
      mutate { add_tag => ["controller"] }
    } else if [logger_name] =~ /com.carboncalc.service/ {
      mutate { add_tag => ["service"] }
    } else if [logger_name] =~ /com.carboncalc.repository/ {
      mutate { add_tag => ["repository"] }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "carbon-calc-logs-%{+YYYY.MM.dd}"
  }
  
  # Also output to stdout for debugging
  stdout {
    codec => rubydebug
  }
}
