# ELK Stack Docker Compose Configuration
# Add this to docker-compose.yml to setup centralized logging

# Elasticsearch - Log storage
elasticsearch:
  image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
  container_name: carbon-calc-elasticsearch
  environment:
    - discovery.type=single-node
    - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    - xpack.security.enabled=false
  ports:
    - "9200:9200"
  volumes:
    - elasticsearch_data:/usr/share/elasticsearch/data
  networks:
    - carbon-network

# Logstash - Log processing
logstash:
  image: docker.elastic.co/logstash/logstash:8.11.0
  container_name: carbon-calc-logstash
  volumes:
    - ./infra/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    - ./logs:/logs
  ports:
    - "5000:5000"
  depends_on:
    - elasticsearch
  networks:
    - carbon-network

# Kibana - Log visualization
kibana:
  image: docker.elastic.co/kibana/kibana:8.11.0
  container_name: carbon-calc-kibana
  environment:
    - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
  ports:
    - "5601:5601"
  depends_on:
    - elasticsearch
  networks:
    - carbon-network

volumes:
  elasticsearch_data:
