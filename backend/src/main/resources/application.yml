  # JWT configuration (custom properties)
  
app:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-in-production}
    expiration: ${JWT_EXPIRATION:86400000}

# External API Configuration
carbon:
  interface:
    api:
      key: ${CARBON_INTERFACE_API_KEY:Z25S0cuIX1yvvRulM1bg}
      url: https://www.carboninterface.com/api/v1

energy:
  data:
    api:
      url: https://api.carbonintensity.org.uk

un:
  emissions:
    api:
      url: https://data.un.org/ws/rest

# Actuator Configuration (Monitoring)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

server:
  port: ${API_PORT:8080}
  error:
    include-message: always
    include-stacktrace: on_param
  
logging:
  level:
    root: INFO
    com.carboncalc: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.springframework.kafka: INFO
    org.springframework.data.redis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/carbon-calc.log
    max-size: 10MB
    max-history: 30
