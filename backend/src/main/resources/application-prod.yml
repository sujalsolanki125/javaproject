spring:
  application:
    name: carbon-calculator
  
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  
  main:
    allow-circular-references: false
  
  lifecycle:
    timeout-per-shutdown-phase: 30s
  
  # Email Configuration - Use environment variables only
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?sslMode=VERIFY_IDENTITY&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        '[format_sql]': false
        '[use_sql_comments]': false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  flyway:
    enabled: false
    baseline-on-migrate: true
    validate-on-migrate: true
    repair-on-migrate: false
    locations: classpath:db/migration
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?sslMode=VERIFY_IDENTITY&serverTimezone=UTC
    user: ${DB_USER}
    password: ${DB_PASSWORD}

# JWT configuration
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600000}

# External API Configuration
carbon:
  interface:
    api:
      key: ${CARBON_INTERFACE_API_KEY}
      url: https://www.carboninterface.com/api/v1
    defaults:
      country: ${DEFAULT_COUNTRY:US}
      state: ${DEFAULT_STATE:CA}

# Climatiq API Configuration
climatiq:
  api:
    key: ${CLIMATIQ_API_KEY}
    url: https://api.climatiq.io

energy:
  data:
    api:
      url: https://api.carbonintensity.org.uk

un:
  emissions:
    api:
      url: https://data.un.org/ws/rest

# Actuator Configuration - Restricted in production
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: production

server:
  port: ${API_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024
  http2:
    enabled: true
  shutdown: graceful

logging:
  level:
    root: WARN
    com.carboncalc: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.springframework.kafka: WARN
    org.springframework.data.redis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/carbon-calc/carbon-calc.log
    max-size: 50MB
    max-history: 90
    total-size-cap: 5GB
