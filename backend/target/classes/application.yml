spring:
  application:
    name: carbon-calculator
  
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  
  main:
    allow-circular-references: true
  
  # Email Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carboncalc}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        '[format_sql]': true
  
  flyway:
    enabled: false
    baseline-on-migrate: true
    validate-on-migrate: false
    repair-on-migrate: true
    locations: classpath:db/migration
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carboncalc}
    user: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  
  # Redis Configuration (disabled for now)
  # data:
  #   redis:
  #     host: ${SPRING_REDIS_HOST:localhost}
  #     port: ${SPRING_REDIS_PORT:6379}
  #     timeout: 2000ms
  #     lettuce:
  #       pool:
  #         max-active: 8
  #         max-idle: 8
  #         min-idle: 2
  
  # Kafka Configuration (disabled for now)
  # kafka:
  #   bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
  #   producer:
  #     key-serializer: org.apache.kafka.common.serialization.StringSerializer
  #     value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  #     acks: all
  #     retries: 3
  #   consumer:
  #     key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  #     value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
  #     group-id: carbon-calc-group
  #     auto-offset-reset: earliest
  #     properties:
  #       spring.json.trusted.packages: com.carboncalc.*
  
  # JWT configuration (custom properties)
  
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}

# External API Configuration
carbon:
  interface:
    api:
      key: ${CARBON_INTERFACE_API_KEY}
      url: https://www.carboninterface.com/api/v1
    defaults:
      country: ${DEFAULT_COUNTRY:US}
      state: ${DEFAULT_STATE:CA}

# Climatiq API Configuration
climatiq:
  api:
    key: ${CLIMATIQ_API_KEY}
    url: https://api.climatiq.io

energy:
  data:
    api:
      url: https://api.carbonintensity.org.uk

un:
  emissions:
    api:
      url: https://data.un.org/ws/rest

# Actuator Configuration (Monitoring)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

server:
  port: ${API_PORT:8080}
  error:
    include-message: always
    include-stacktrace: on_param
  
logging:
  level:
    root: INFO
    com.carboncalc: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.springframework.kafka: INFO
    org.springframework.data.redis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/carbon-calc.log
    max-size: 10MB
    max-history: 30
